<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 230" width="600" height="230" role="img" aria-label="Pokédex Scrambler visual example showing 123 padded to 0123 and scrambled into Scyther, Ditto, Shuckle, and Iron Crown">
  <defs>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="600" height="230" rx="14" fill="url(#bg-grad)" stroke="#334155" stroke-width="2"/>

  <!-- Step 1: Search Bar Mock -->
  <rect x="24" y="20" width="552" height="46" rx="10" fill="#0f172a" stroke="#3b82f6" stroke-width="2"/>
  <text x="42" y="49" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700">123</text>
  <text x="82" y="48" fill="#94a3b8" font-family="ui-monospace, monospace" font-size="13">→ padded to 0123 (4-digit National Dex)</text>
  <rect x="476" y="27" width="92" height="32" rx="6" fill="#2563eb"/>
  <text x="522" y="48" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Scramble</text>

  <!-- Permutation Pills Row -->
  <text x="24" y="92" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600">Digit Permutations:</text>
  <g transform="translate(148, 77)" font-family="ui-monospace, monospace" font-size="11" font-weight="700">
    <rect x="0" y="0" width="52" height="22" rx="4" fill="#1e293b" stroke="#475569"/>
    <text x="26" y="15" fill="#f8fafc" text-anchor="middle">0123</text>

    <rect x="60" y="0" width="52" height="22" rx="4" fill="#1e293b" stroke="#475569"/>
    <text x="86" y="15" fill="#f8fafc" text-anchor="middle">0132</text>

    <rect x="120" y="0" width="52" height="22" rx="4" fill="#1e293b" stroke="#475569"/>
    <text x="146" y="15" fill="#f8fafc" text-anchor="middle">0213</text>

    <rect x="180" y="0" width="52" height="22" rx="4" fill="#1e293b" stroke="#475569"/>
    <text x="206" y="15" fill="#f8fafc" text-anchor="middle">0231</text>

    <rect x="240" y="0" width="52" height="22" rx="4" fill="#1e293b" stroke="#475569"/>
    <text x="266" y="15" fill="#f8fafc" text-anchor="middle">0312</text>

    <rect x="300" y="0" width="52" height="22" rx="4" fill="#1e293b" stroke="#475569"/>
    <text x="326" y="15" fill="#f8fafc" text-anchor="middle">0321</text>

    <rect x="360" y="0" width="58" height="22" rx="4" fill="#1e3a8a" stroke="#3b82f6"/>
    <text x="389" y="15" fill="#93c5fd" text-anchor="middle">1023</text>
  </g>

  <!-- Result Mini Cards -->
  <g transform="translate(24, 114)" font-family="system-ui, -apple-system, sans-serif">
    <!-- Card 1: #0123 Scyther -->
    <rect x="0" y="0" width="130" height="94" rx="10" fill="#0f172a" stroke="#334155"/>
    <text x="12" y="22" fill="#94a3b8" font-family="ui-monospace, monospace" font-size="11" font-weight="700">#0123 • Gen 1</text>
    <text x="12" y="44" fill="#f8fafc" font-size="14" font-weight="800">Scyther</text>
    <rect x="12" y="54" width="42" height="16" rx="8" fill="#84cc16"/>
    <text x="33" y="65" fill="#ffffff" font-size="9" font-weight="700" text-anchor="middle">BUG</text>
    <rect x="58" y="54" width="50" height="16" rx="8" fill="#6366f1"/>
    <text x="83" y="65" fill="#ffffff" font-size="9" font-weight="700" text-anchor="middle">FLYING</text>
    <text x="12" y="84" fill="#3b82f6" font-size="10" font-weight="700">BST 500 • Info ↗</text>

    <!-- Card 2: #0132 Ditto -->
    <rect x="140" y="0" width="130" height="94" rx="10" fill="#0f172a" stroke="#334155"/>
    <text x="152" y="22" fill="#94a3b8" font-family="ui-monospace, monospace" font-size="11" font-weight="700">#0132 • Gen 1</text>
    <text x="152" y="44" fill="#f8fafc" font-size="14" font-weight="800">Ditto</text>
    <rect x="152" y="54" width="54" height="16" rx="8" fill="#9ca3af"/>
    <text x="179" y="65" fill="#ffffff" font-size="9" font-weight="700" text-anchor="middle">NORMAL</text>
    <text x="152" y="84" fill="#3b82f6" font-size="10" font-weight="700">BST 288 • Info ↗</text>

    <!-- Card 3: #0213 Shuckle -->
    <rect x="280" y="0" width="130" height="94" rx="10" fill="#0f172a" stroke="#334155"/>
    <text x="292" y="22" fill="#94a3b8" font-family="ui-monospace, monospace" font-size="11" font-weight="700">#0213 • Gen 2</text>
    <text x="292" y="44" fill="#f8fafc" font-size="14" font-weight="800">Shuckle</text>
    <rect x="292" y="54" width="42" height="16" rx="8" fill="#84cc16"/>
    <text x="313" y="65" fill="#ffffff" font-size="9" font-weight="700" text-anchor="middle">BUG</text>
    <rect x="338" y="54" width="44" height="16" rx="8" fill="#b45309"/>
    <text x="360" y="65" fill="#ffffff" font-size="9" font-weight="700" text-anchor="middle">ROCK</text>
    <text x="292" y="84" fill="#3b82f6" font-size="10" font-weight="700">BST 505 • Info ↗</text>

    <!-- Card 4: #1023 Iron Crown -->
    <rect x="420" y="0" width="132" height="94" rx="10" fill="#0f172a" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="432" y="22" fill="#93c5fd" font-family="ui-monospace, monospace" font-size="11" font-weight="700">#1023 • Gen 9</text>
    <text x="432" y="44" fill="#f8fafc" font-size="14" font-weight="800">Iron Crown</text>
    <rect x="432" y="54" width="46" height="16" rx="8" fill="#64748b"/>
    <text x="455" y="65" fill="#ffffff" font-size="9" font-weight="700" text-anchor="middle">STEEL</text>
    <rect x="482" y="54" width="56" height="16" rx="8" fill="#ec4899"/>
    <text x="510" y="65" fill="#ffffff" font-size="9" font-weight="700" text-anchor="middle">PSYCHIC</text>
    <text x="432" y="84" fill="#3b82f6" font-size="10" font-weight="700">BST 590 • Info ↗</text>
  </g>
</svg>
